# Optional. Only needed when the lab wants TLS or a hostname in front of the
# API; the API already serves the built front end on its own.
#
# Expects a certificate and key in the mounted TLS directory:
#   tls/fullchain.pem, tls/privkey.pem
# Your IT department issues these. A self-signed pair is fine for a first test and is not
# fine for anything anyone else uses.

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Recording uploads are large. The API enforces its own limit through
    # DBSSPEECH_MAX_UPLOAD_BYTES; this only has to not be the smaller of the two.
    client_max_body_size 16g;

    # A QC report or a table page can take a while on a large recording. The
    # default 60s turns a slow answer into a 504 that looks like a bug.
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
